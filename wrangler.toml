name = "agenda-site"
compatibility_date = "2025-09-01"
pages_build_output_dir = "dist"

# Production bindings are configured in the Cloudflare dashboard
# (Pages > Settings > Bindings), not here:
#
#   AGENDA_KV  KV namespace binding
#   EDIT_KEY   encrypted environment variable (your edit password)
#
# `npm run dev:full` passes --kv AGENDA_KV, which spins up a local simulated
# KV store, so nothing below is needed to develop locally. Uncomment and fill
# in a real id only if you plan to deploy with `wrangler pages deploy` instead
# of through the GitHub integration.
#
# [[kv_namespaces]]
# binding = "AGENDA_KV"
# id = "your-kv-namespace-id"
